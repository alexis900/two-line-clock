name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  push:
    tags:
      - 'v*'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gettext libglib2.0-bin

      - name: Check shell scripts
        run: sh -n build.sh

      - name: Validate GSettings schema
        run: glib-compile-schemas --strict --dry-run schemas

      - name: Compile translations
        run: |
          for po in po/*.po; do
            [ -f "$po" ] || continue
            lang=$(basename "$po" .po)
            mkdir -p "locale/$lang/LC_MESSAGES"
            msgfmt -c -o "locale/$lang/LC_MESSAGES/two-line-clock.mo" "$po"
          done

      - name: Run unit tests
        run: |
          sudo apt-get install -y gjs gir1.2-glib-2.0
          gjs -m tests/lib.test.js

      - name: Build package
        run: ./build.sh pack

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: dist/*.shell-extension.zip

  release:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gettext libglib2.0-bin

      - name: Build package
        run: ./build.sh pack

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.shell-extension.zip
          generate_release_notes: true
